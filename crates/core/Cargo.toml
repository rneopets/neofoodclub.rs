[package]
name = "neofoodclub"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2"
itertools = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.10.0"
bitflags = "2.11.0"
serde_qs = "1.0.0"
chrono = "0.4.43"
chrono-tz = "0.10.4"
comfy-table = { version = "8.0.0", default-features = false, optional = true }
rustc-hash = "2"

[features]
# Default-on so existing users keep Bets::table / Bets::stats_table. Consumers
# that don't need the text tables (e.g. the wasm build) can drop comfy-table
# from their dependency graph with --no-default-features.
default = ["tables"]
tables = ["dep:comfy-table"]

[lib]
name = "neofoodclub"

[[example]]
name = "all_bets_table"
path = "examples/all_bets_table.rs"
# Only builds with the `tables` feature (default-on), which it demonstrates.
required-features = ["tables"]

[[bench]]
name = "math_benches"
harness = false

[dev-dependencies]
divan = { version = "5.0.0", package = "codspeed-divan-compat" }
